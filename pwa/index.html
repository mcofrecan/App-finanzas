<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caja Familiar</title>
<meta name="description" content="Plan de presupuesto por ítems, registro de gastos y proyección de liquidez.">
<meta name="theme-color" content="#1D6A50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="top" id="top"><h1>Caja Familiar</h1></header>
  <div id="banner"></div>
  <main id="view"><div class="card empty"><b>Cargando…</b></div></main>
</div>
<button class="fab" id="fab" aria-label="Registrar gasto o ingreso" data-act="nuevo" hidden>+</button>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Plan</button>
  <button data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button data-tab="proy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 19l6-7 4 4 8-10"/></svg>Proyección</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<noscript>Esta app necesita JavaScript.</noscript>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
